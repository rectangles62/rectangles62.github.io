<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECTANGLES</title>
    
    <!-- Google Search Console Meta Tag Verification -->
    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" />
    <meta name="description" content="Rectangles — Interactive Geometry Matrix Engine." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Syne', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            accent: '#38bdf8',
                            bg: '#05070c',
                            panel: '#090d16',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Prevent scrollbars and lock layout to viewport */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05070c;
            user-select: none;
        }

        .glass-panel {
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Subtle grid background pattern */
        .grid-pattern {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Button Active States */
        .btn-mode-active {
            background-color: #38bdf8 !important;
            color: #000000 !important;
            font-weight: 700 !important;
        }
    </style>
</head>
<body class="bg-brand-bg text-slate-200 font-mono flex flex-col h-screen w-screen overflow-hidden antialiased select-none">
    
    <!-- Background Grid -->
    <div class="fixed inset-0 grid-pattern pointer-events-none z-0"></div>

    <!-- HEADER BAR -->
    <header class="relative z-20 px-4 sm:px-6 py-3 border-b border-white/10 glass-panel flex items-center justify-between">
        <!-- Logo & Title ONLY -->
        <div class="flex items-center gap-3">
            <div class="w-6 h-6 border-2 border-brand-accent bg-brand-accent/20 flex items-center justify-center">
                <div class="w-2 h-2 bg-brand-accent"></div>
            </div>
            <span class="font-heading font-extrabold tracking-widest text-xl text-white">
                RECTANGLES
            </span>
        </div>
    </header>

    <!-- MAIN INTERACTIVE CANVAS CONTAINER -->
    <main class="relative z-10 flex-1 p-3 sm:p-5 flex flex-col h-[calc(100vh-57px)]">
        <div class="flex-1 flex flex-col rounded-xl border border-white/10 glass-panel overflow-hidden shadow-2xl relative">
            
            <!-- CONTROLS OVERLAY BAR -->
            <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-2.5 bg-[#080c14]/90 border-b border-white/10 text-xs tracking-wider z-20">
                
                <!-- Mode Selector Toggles -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <span class="text-slate-500 font-semibold mr-1">MODE:</span>
                    <button id="btn-elastic" onclick="setMode('elastic')" class="btn-mode-active px-3 py-1 rounded bg-white/5 text-slate-300 hover:bg-white/10 transition-all font-mono">
                        ELASTIC RECTS
                    </button>
                    <button id="btn-subdivide" onclick="setMode('subdivide')" class="px-3 py-1 rounded bg-white/5 text-slate-300 hover:bg-white/10 transition-all font-mono">
                        GOLDEN SPLIT
                    </button>
                    <button id="btn-wireframe" onclick="setMode('wireframe')" class="px-3 py-1 rounded bg-white/5 text-slate-300 hover:bg-white/10 transition-all font-mono">
                        WIREFRAME
                    </button>
                </div>

                <!-- Reset Button -->
                <button onclick="resetMatrix()" class="px-3 py-1 rounded bg-white/5 text-slate-300 hover:text-white hover:bg-white/10 transition-all flex items-center gap-1.5 font-mono">
                    <i class="fa-solid fa-rotate-right text-[10px]"></i> RESET MATRIX
                </button>
            </div>

            <!-- CANVAS VIEWPORT -->
            <div class="relative flex-1 w-full h-full bg-[#04060a] overflow-hidden cursor-crosshair">
                <canvas id="matrixCanvas" class="w-full h-full block"></canvas>

                <!-- BOTTOM LEFT STATUS HUD OVERLAY -->
                <div class="absolute bottom-4 left-4 pointer-events-none font-mono text-[11px] leading-relaxed text-slate-400 bg-black/75 backdrop-blur-md p-3 rounded-lg border border-white/10 space-y-1 shadow-lg z-20 min-w-[150px]">
                    <div>CELLS_COUNT: <span id="hud-cells" class="text-brand-accent font-bold">96</span></div>
                    <div>PHYSICS_FORCE: <span id="hud-force" class="text-emerald-400 font-bold">ACTIVE</span></div>
                    <div>FPS: <span id="hud-fps" class="text-white font-bold">60</span></div>
                </div>
            </div>

        </div>
    </main>

    <!-- JAVASCRIPT MATRIX ENGINE -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let dpr = window.devicePixelRatio || 1;

        let cells = [];
        const cols = 12;
        const rows = 8;
        let currentMode = 'elastic'; // 'elastic', 'subdivide', 'wireframe'

        let mouse = {
            x: -1000,
            y: -1000,
            radius: 160
        };

        // FPS Tracker
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        let fps = 60;

        function resizeCanvas() {
            const container = canvas.parentElement;
            width = container.clientWidth;
            height = container.clientHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            initMatrix();
        }

        class MatrixRectangle {
            constructor(x, y, w, h, col, row) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.col = col;
                this.row = row;

                this.vx = 0;
                this.vy = 0;
                this.rotation = (Math.random() - 0.5) * 0.08;
                this.vRot = 0;
                this.scale = 1;
                this.alpha = 0.18;
            }

            update() {
                const centerX = this.x + this.w / 2;
                const centerY = this.y + this.h / 2;

                const dx = mouse.x - centerX;
                const dy = mouse.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    const force = (1 - dist / mouse.radius);
                    const angle = Math.atan2(dy, dx);

                    // Push vectors
                    const pushX = -Math.cos(angle) * force * 30;
                    const pushY = -Math.sin(angle) * force * 30;

                    this.vx += pushX * 0.12;
                    this.vy += pushY * 0.12;
                    this.vRot += (Math.random() - 0.5) * 0.04 * force;
                    this.scale = 1 + force * 0.2;
                    this.alpha = Math.min(0.65, 0.18 + force * 0.5);
                } else {
                    this.scale += (1 - this.scale) * 0.1;
                    this.alpha += (0.18 - this.alpha) * 0.1;
                }

                // Spring back physics
                const k = 0.08;
                const damping = 0.84;

                const ax = (this.baseX - this.x) * k;
                const ay = (this.baseY - this.y) * k;

                this.vx = (this.vx + ax) * damping;
                this.vy = (this.vy + ay) * damping;

                this.x += this.vx;
                this.y += this.vy;

                this.vRot *= damping;
                this.rotation += this.vRot;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);

                const halfW = this.w / 2;
                const halfH = this.h / 2;

                if (currentMode === 'wireframe') {
                    // Wireframe cyan outline
                    ctx.strokeStyle = `rgba(56, 189, 248, ${this.alpha * 1.8})`;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-halfW + 3, -halfH + 3, this.w - 6, this.h - 6);

                    // Vertex connection dot
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-halfW + 3, -halfH + 3, 3, 3);
                } else if (currentMode === 'subdivide') {
                    // Golden ratio split
                    const phiW = this.w * 0.618;

                    ctx.fillStyle = `rgba(14, 165, 233, ${this.alpha * 0.4})`;
                    ctx.fillRect(-halfW + 3, -halfH + 3, phiW - 4, this.h - 6);

                    ctx.strokeStyle = `rgba(56, 189, 248, ${this.alpha * 1.2})`;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-halfW + 3, -halfH + 3, phiW - 4, this.h - 6);
                    ctx.strokeRect(-halfW + phiW + 1, -halfH + 3, this.w - phiW - 4, this.h - 6);

                    // Corner vertex dot
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-halfW + 3, -halfH + 3, 3, 3);
                } else {
                    // Elastic Rects (Default matching screenshot)
                    ctx.fillStyle = `rgba(14, 165, 233, ${this.alpha * 0.35})`;
                    ctx.fillRect(-halfW + 3, -halfH + 3, this.w - 6, this.h - 6);

                    ctx.strokeStyle = `rgba(56, 189, 248, ${Math.max(0.12, this.alpha * 1.2)})`;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-halfW + 3, -halfH + 3, this.w - 6, this.h - 6);

                    // Corner cyan dot marker matching photo
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-halfW + 3, -halfH + 3, 3, 3);
                }

                ctx.restore();
            }
        }

        function initMatrix() {
            cells = [];
            const cellW = width / cols;
            const cellH = height / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW;
                    const y = r * cellH;
                    cells.push(new MatrixRectangle(x, y, cellW, cellH, c, r));
                }
            }

            document.getElementById('hud-cells').textContent = cells.length;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.classList.remove('btn-mode-active');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            if (activeBtn) activeBtn.classList.add('btn-mode-active');
        }

        function resetMatrix() {
            initMatrix();
        }

        // Pointer Events
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.touches[0].clientX - rect.left;
                mouse.y = e.touches[0].clientY - rect.top;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Animation Loop
        function animate(timestamp) {
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                document.getElementById('hud-fps').textContent = fps;
            }

            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < cells.length; i++) {
                cells[i].update();
                cells[i].draw();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            requestAnimationFrame(animate);
        });

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
