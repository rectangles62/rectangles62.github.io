<body class="bg-brand-bg text-slate-200 font-mono flex flex-col h-screen w-screen overflow-hidden antialiased select-none">

    <!-- MAIN INTERACTIVE CANVAS CONTAINER -->
    <main class="relative z-10 flex-1 p-3 sm:p-5 flex flex-col h-[calc(100vh-57px)]">
        <div class="flex-1 flex flex-col rounded-xl border border-white/10 glass-panel overflow-hidden shadow-2xl relative">
            
            <!-- CANVAS VIEWPORT -->
            <div class="relative flex-1 w-full h-full bg-[#04060a] overflow-hidden cursor-crosshair">
                <canvas id="matrixCanvas" class="w-full h-full block"></canvas>

            </div>

        </div>
    </main>

    <!-- JAVASCRIPT MATRIX ENGINE -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let dpr = window.devicePixelRatio || 1;

        let cells = [];
        let cols = 4;
        let rows = 2;

        let mouse = {
            x: -1000,
            y: -1000,
            radius: 220,
            vx: 0,
            vy: 0
        };

        // FPS Tracker
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        let fps = 60;

        function resizeCanvas() {
            const container = canvas.parentElement;
            width = container.clientWidth;
            height = container.clientHeight;

            // Desktop: 4 columns x 2 rows.
            // Mobile: 2 columns x 4 rows.
            const isMobile = window.matchMedia('(max-width: 640px)').matches;
            cols = isMobile ? 2 : 4;
            rows = isMobile ? 4 : 2;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            initMatrix();
        }

        class MatrixFan {
            constructor(x, y, radius) {
                this.baseX = x;
                this.baseY = y;
                this.radius = radius;
                this.rotation = 0;
                this.vRot = 0;
                this.scale = 1;
                this.alpha = 0.92;
                this.bladeCount = 3;
            }

            update() {
                const dx = mouse.x - this.baseX;
                const dy = mouse.y - this.baseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    const force = (1 - dist / mouse.radius);
                    
                    const crossProduct = (this.baseX - mouse.x) * mouse.vy - (this.baseY - mouse.y) * mouse.vx;
                    const spinImpulse = ((crossProduct * 0.0002) + ((Math.random() - 0.5) * 0.05 * force)) * 0.5;

                    this.vRot += spinImpulse * force;
                    this.scale = 1 + force * 0.25;
                    this.alpha = Math.min(1, 0.92 + force * 0.08);
                } else {
                    this.scale += (1 - this.scale) * 0.1;
                    this.alpha += (0.92 - this.alpha) * 0.1;
                }

                this.vRot *= 0.96;
                this.rotation += this.vRot;
            }

            draw() {
                ctx.save();
                ctx.translate(this.baseX, this.baseY);

                // Rotation boundary: sized to enclose the full swept
                // area of the custom propeller blades.
                const rotationRadius = this.radius * 1.32; // Keep the circle size fixed while the propeller animates.
                ctx.strokeStyle = `rgba(56, 189, 248, ${this.alpha * 0.55})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, rotationRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Draw the custom three-blade blue propeller.
                // The original shape is authored in a 420 x 420 viewBox
                // and scaled to fit each matrix cell.
                ctx.rotate(this.rotation);
                const fanScale = this.radius * 0.96 / 200; // Keep fan size constant during rotation.
                ctx.scale(fanScale, fanScale);

                const bladePath = () => {
                    ctx.beginPath();
                    ctx.moveTo(-24, -34);
                    ctx.bezierCurveTo(-49, -57, -105, -76, -147, -116);
                    ctx.bezierCurveTo(-175, -143, -177, -174, -156, -188);
                    ctx.bezierCurveTo(-135, -202, -108, -185, -85, -166);
                    ctx.bezierCurveTo(-44, -132, -20, -85, 9, -48);
                    ctx.bezierCurveTo(14, -42, 19, -38, 24, -34);
                    ctx.closePath();
                };

                for (let i = 0; i < 3; i++) {
                    ctx.save();
                    ctx.rotate(i * (Math.PI * 2 / 3));

                    const bladeGradient = ctx.createLinearGradient(-150, -180, 35, -25);
                    bladeGradient.addColorStop(0, `rgba(85, 155, 255, ${this.alpha})`);
                    bladeGradient.addColorStop(0.38, `rgba(23, 100, 213, ${this.alpha})`);
                    bladeGradient.addColorStop(0.75, `rgba(7, 80, 184, ${this.alpha})`);
                    bladeGradient.addColorStop(1, `rgba(0, 55, 131, ${this.alpha})`);

                    bladePath();
                    ctx.fillStyle = bladeGradient;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(65, 145, 245, ${Math.min(0.85, this.alpha * 1.5)})`;
                    ctx.lineWidth = 2.5;
                    ctx.lineJoin = 'round';
                    ctx.stroke();

                    // A restrained glossy highlight along each blade
                    ctx.beginPath();
                    ctx.moveTo(-151, -178);
                    ctx.bezierCurveTo(-125, -183, -96, -155, -76, -134);
                    ctx.bezierCurveTo(-48, -104, -29, -70, -13, -49);
                    ctx.strokeStyle = `rgba(150, 200, 255, ${this.alpha * 0.45})`;
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    ctx.restore();
                }

                // Plain, smooth center hub — no spokes or center dot
                const hubGradient = ctx.createRadialGradient(-12, -15, 2, 0, 0, 46);
                hubGradient.addColorStop(0, `rgba(40, 125, 235, ${this.alpha})`);
                hubGradient.addColorStop(0.68, `rgba(7, 82, 185, ${this.alpha})`);
                hubGradient.addColorStop(1, `rgba(0, 55, 121, ${this.alpha})`);

                ctx.beginPath();
                ctx.arc(0, 0, 44, 0, Math.PI * 2);
                ctx.fillStyle = hubGradient;
                ctx.fill();
                ctx.strokeStyle = `rgba(6, 70, 155, ${Math.min(0.9, this.alpha * 1.7)})`;
                ctx.lineWidth = 5;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 39, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(74, 148, 245, ${this.alpha * 0.7})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            }
        }

        function initMatrix() {
            cells = [];
            const cellW = width / cols;
            const cellH = height / rows;

            // Keep neighboring rotation circles from overlapping.
            // Each circle is 1.32 × fanRadius, so cap the fan radius
            // to fit within the smaller half-cell spacing.
            const fanRadius = Math.min(cellW, cellH) / (2 * 1.32) * 0.94;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = (c + 0.5) * cellW;
                    const y = (r + 0.5) * cellH;
                    cells.push(new MatrixFan(x, y, fanRadius));
                }
            }

        }

        function resetMatrix() {
            initMatrix();
        }

        // Pointer Events
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            mouse.vx = currentX - mouse.x;
            mouse.vy = currentY - mouse.y;
            mouse.x = currentX;
            mouse.y = currentY;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
            mouse.vx = 0;
            mouse.vy = 0;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const currentX = e.touches[0].clientX - rect.left;
                const currentY = e.touches[0].clientY - rect.top;

                mouse.vx = currentX - mouse.x;
                mouse.vy = currentY - mouse.y;
                mouse.x = currentX;
                mouse.y = currentY;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            mouse.x = -1000;
            mouse.y = -1000;
            mouse.vx = 0;
            mouse.vy = 0;
        });

        // Animation Loop
        function animate(timestamp) {
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
            }

            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < cells.length; i++) {
                cells[i].update();
                cells[i].draw();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            requestAnimationFrame(animate);
        });

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
